{% load static i18n %}
<!DOCTYPE html>
<html>
  <head>
    <title>{% trans "PeeringDB API Documentation" %}</title>
    <!-- needed for adaptive design -->
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="{% static "fonts/montserrat/montserrat.css" %}" />
    <link rel="stylesheet" type="text/css" href="{% static "fonts/roboto/roboto.css" %}" />
    <!-- ReDoc doesn't change outer page styles -->
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      div.footer,
      div.header {
        background-color: #2c8fb2;
        color: #fff;
        font-family: Roboto, sans-serif;
        font-weight: 400;
        padding: 5px;
        font-size: 12px;
      }
      div.footer a,
      div.header a {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="header">{% include "apidocs/resources.html" %}</div>
    <redoc spec-url='{% static "api-schema.yaml" %}'></redoc>
    <div class="footer">{% include "apidocs/resources.html" %}</div>

    <script src="{% static "redoc/redoc.standalone.js" %}"></script>
  </body>
</html>
